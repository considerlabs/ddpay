<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>디디페이 APP — 화면설계 프로토타입</title>
<style>
  :root {
    --dd-green: #1a7a3c;
    --dd-green-light: #e8f5ec;
    --dd-orange: #e8891a;
    --dd-orange-light: #fff4e6;
    --bg: #f5f5f5;
    --ink: #111;
    --muted: #8a8a8a;
    --line: #ececec;
    --card: #fff;
    --phone-w: 390px;
    --phone-h: 780px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    background: #e8ebe9;
    color: var(--ink);
    min-height: 100vh;
  }
  .shell {
    display: grid;
    grid-template-columns: 240px 1fr 340px;
    min-height: 100vh;
  }
  @media (max-width: 1100px) {
    .shell { grid-template-columns: 1fr; }
    .nav, .desc { max-height: 280px; overflow: auto; }
    .stage { padding: 16px !important; }
  }

  /* Left nav */
  .nav {
    background: #121712;
    color: #fff;
    padding: 20px 14px;
    overflow-y: auto;
  }
  .nav h1 { font-size: 14px; font-weight: 800; letter-spacing: 0.04em; color: #7dcea0; margin-bottom: 4px; }
  .nav .sub { font-size: 11px; color: #8a9; margin-bottom: 18px; line-height: 1.4; }
  .nav .group { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #667; margin: 14px 6px 6px; }
  .nav button {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0; color: #ccd; padding: 9px 10px;
    border-radius: 10px; font-size: 13px; cursor: pointer; margin-bottom: 2px;
  }
  .nav button:hover { background: #1e2a20; color: #fff; }
  .nav button.active { background: var(--dd-green); color: #fff; font-weight: 700; }

  /* Stage */
  .stage {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 28px 20px 40px; gap: 14px;
  }
  .stage-title { font-size: 13px; color: #445; font-weight: 600; }
  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: var(--bg); border-radius: 36px;
    border: 10px solid #1a1a1a; box-shadow: 0 24px 60px rgba(0,0,0,.22);
    overflow: hidden; position: relative; display: flex; flex-direction: column;
  }
  .phone-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .phone-scroll::-webkit-scrollbar { width: 0; }

  /* Right desc */
  .desc {
    background: #fff; border-left: 1px solid #ddd; padding: 22px 20px; overflow-y: auto;
  }
  .desc h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .desc .route { font-size: 12px; color: var(--dd-green); font-family: ui-monospace, monospace; margin-bottom: 14px; }
  .desc h3 { font-size: 12px; font-weight: 700; color: #555; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .desc p, .desc li { font-size: 13px; line-height: 1.55; color: #333; }
  .desc ul { padding-left: 18px; }
  .desc li { margin-bottom: 4px; }
  .tag {
    display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: var(--dd-green-light); color: var(--dd-green); font-weight: 700; margin-right: 4px;
  }

  /* Shared UI bits inside phone */
  .ph { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); height: 52px;
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
  .ph .back { position: absolute; left: 12px; font-size: 22px; color: #555; background: none; border: 0; cursor: pointer; }
  .bnav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 58px; background: #fff;
    border-top: 1px solid #e5e5e5; display: grid; grid-template-columns: repeat(5,1fr);
    font-size: 10px; color: #aaa; z-index: 6;
  }
  .bnav div { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .bnav .on { color: var(--dd-green); font-weight: 700; }
  .bnav .ico { font-size: 16px; }
  .pad { padding: 14px 16px 70px; }
  .pad-nb { padding: 14px 16px 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); margin-bottom: 10px;
  }
  .btn {
    display: flex; align-items: center; justify-content: center; height: 44px;
    border-radius: 12px; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
  }
  .btn-g { background: var(--dd-green); color: #fff; }
  .btn-o { background: var(--dd-orange); color: #fff; }
  .btn-ol { background: #fff; border: 1.5px solid #ddd; color: #555; }
  .btn-od { background: #fff; border: 2px solid var(--dd-orange); color: var(--dd-orange); }
  .btn:disabled, .btn.disabled { background: #d4d4d4; color: #999; border-color: #d4d4d4; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .muted { color: var(--muted); font-size: 12px; }
  .xs { font-size: 11px; color: #999; }
  .label { font-size: 12px; color: #777; margin-bottom: 6px; }
  .input {
    height: 44px; border: 1px solid #ddd; border-radius: 12px; padding: 0 12px;
    width: 100%; font-size: 14px; background: #fff; margin-bottom: 10px;
  }
  .badge-g { color: var(--dd-green); font-weight: 700; font-size: 13px; }
  .badge-r { color: #e11; font-weight: 700; font-size: 13px; }
  .badge-gr { color: #999; font-weight: 700; font-size: 13px; }
  .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 8px; text-align: center; font-size: 12px; font-weight: 600;
  }
  .tile .em { font-size: 22px; display: block; margin-bottom: 4px; }
  .tile.on { border: 2px solid var(--dd-green); background: var(--dd-green-light); }
  .progress { height: 3px; background: #eee; }
  .progress > i { display: block; height: 100%; background: var(--dd-green); }
  .progress.orange > i { background: var(--dd-orange); }
  .pill {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; background: #e8f5ec; color: var(--dd-green);
  }
  .pill.wait { background: #eee; color: #666; }
  .pill.rej { background: #fee; color: #c00; }
  .detail-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid #f3f3f3; font-size: 13px;
  }
  .detail-row span:first-child { color: #888; width: 100px; flex-shrink: 0; }
  .detail-row span:last-child { text-align: right; flex: 1; }
  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .sheet {
    background: #fff; border-radius: 18px; padding: 20px; width: 100%;
    max-height: 85%; overflow-y: auto; text-align: center;
  }
  .sheet .ico-circle {
    width: 56px; height: 56px; border-radius: 50%; background: var(--dd-orange-light);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 24px;
  }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #eee; border-radius: 12px; padding: 3px; margin: 10px 0; }
  .seg button { height: 34px; border: 0; border-radius: 10px; background: transparent; font-size: 13px; font-weight: 700; color: #888; cursor: pointer; }
  .seg button.on { background: #fff; color: #111; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .ccard {
    width: 148px; height: 88px; border-radius: 12px; padding: 10px;
    background: linear-gradient(135deg,#3b82f6,#1d4ed8); color: #fff; text-align: left;
    flex-shrink: 0; border: 2px solid transparent;
  }
  .ccard.on { border-color: var(--dd-orange); }
  .hint { font-size: 11px; color: #999; line-height: 1.45; margin-top: 8px; }
  .warn { font-size: 11px; color: #e11; margin-top: 6px; text-align: left; }
  .toggle {
    width: 46px; height: 28px; border-radius: 999px; background: var(--dd-green); position: relative;
  }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 20px; width: 24px; height: 24px;
    background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="nav">
    <h1>DDPAY · 화면설계</h1>
    <p class="sub">모바일 웹 430px 기준</p>
    <div id="navList"></div>
  </aside>

  <main class="stage">
    <div class="stage-title" id="stageTitle">화면을 선택하세요</div>
    <div class="phone"><div class="phone-scroll" id="phone"></div></div>
  </main>

  <aside class="desc" id="desc">
    <h2>디스크립션</h2>
    <p class="muted">왼쪽에서 화면을 선택하면 상세 설명이 표시됩니다.</p>
  </aside>
</div>

<script>
const G = {
  bnav(active) {
    const tabs = [
      ["home","🏠","홈"],["contract","✏️","계약등록"],["b2b","🔗","비즈링크"],
      ["card","💳","카드등록"],["profile","👤","내정보"]
    ];
    return `<div class="bnav">${tabs.map(([id,ico,l]) =>
      `<div class="${active===id?"on":""}"><span class="ico">${ico}</span>${l}</div>`
    ).join("")}</div>`;
  },
  header(title, back=true) {
    return `<div class="ph">${back?`<button class="back" type="button">‹</button>`:""}${title}</div>`;
  }
};

const screens = [
  {
    id: "login", group: "인증", name: "01. 로그인", route: "/login",
    desc: {
      purpose: "가맹점 계정으로 APP 진입. 브랜드 신뢰를 첫 화면에 고정.",
      layout: ["상단 DD·PAY 브랜드 바","중앙 로고(DD) + 디디페이 + 서브카피","아이디/비밀번호 필드(h-12, rounded-xl)","로그인 CTA(green full-width)","테스트 계정 힌트"],
      rules: ["빈 값 제출 시 에러: 아이디와 비밀번호를 입력해주세요.","성공 시 /home 이동","회원가입/소셜 로그인 없음(B2B 전용)"]
    },
    html() {
      return `
        <div class="ph" style="border:0"><span style="color:var(--dd-green);font-size:13px;letter-spacing:.12em;font-weight:800">DD·PAY</span></div>
        <div class="pad-nb" style="padding-top:36px;text-align:center">
          <div style="width:64px;height:64px;border-radius:18px;background:var(--dd-green-light);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--dd-green)">DD</div>
          <div style="font-size:22px;font-weight:800;margin-bottom:4px">디디페이</div>
          <div class="muted" style="margin-bottom:28px">가맹점 결제 관리 서비스</div>
          <div style="text-align:left">
            <div class="label">아이디</div>
            <input class="input" placeholder="아이디를 입력하세요" />
            <div class="label">비밀번호</div>
            <input class="input" type="password" placeholder="비밀번호를 입력하세요" />
          </div>
          <button class="btn btn-g" style="margin-top:8px">로그인</button>
          <p class="hint" style="margin-top:18px;text-align:center">테스트 계정: 아무 아이디/비밀번호 입력</p>
        </div>`;
    }
  },
  {
    id: "home", group: "홈", name: "02. 홈", route: "/home",
    desc: {
      purpose: "계약결제·비즈링크·식자재 진입 허브. 이번달 현황 요약.",
      layout: ["유저명 + DDPAY","그린 프로모 배너(캐러셀 도트)","결제카드등록 바로가기","계약결제 3타일","이번달 등록 현황 3지표","비즈링크 섹션","식자재몰 섹션","BottomNav"],
      rules: ["카드 수 뱃지로 등록 상태 노출","식자재 버튼은 현재 미연결"]
    },
    html() {
      return `
        <div style="padding:18px 16px 8px" class="row">
          <strong style="font-size:14px">깐부치킨 울릉도점 님</strong>
          <span style="font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--dd-green)">DDPAY</span>
        </div>
        <div style="margin:0 14px 12px;background:var(--dd-green);border-radius:16px;padding:16px;color:#fff">
          <div style="font-size:10px;opacity:.75;margin-bottom:6px">물류, 인건비, 경조사비까지</div>
          <div style="font-size:16px;font-weight:900;line-height:1.35">복잡한 관리비용<br>이젠 후대폰 하나로<br>해결하세요!</div>
          <div style="display:flex;justify-content:center;gap:5px;margin-top:12px">
            <i style="width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block"></i>
            <i style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);display:inline-block"></i>
            <i style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);display:inline-block"></i>
          </div>
        </div>
        <div class="pad">
          <div class="card row">
            <div class="row" style="gap:10px"><span style="font-size:18px">💳</span><span style="font-size:14px;font-weight:600">결제카드등록</span></div>
            <div class="row" style="gap:6px"><span style="width:20px;height:20px;border-radius:50%;background:var(--dd-green);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800">1</span>›</div>
          </div>
          <div style="font-size:13px;font-weight:800;margin:6px 0 8px">계약결제 서비스</div>
          <div class="grid3" style="margin-bottom:12px">
            <div class="tile"><span class="em">📝</span>계약등록</div>
            <div class="tile"><span class="em">📋</span>등록현황</div>
            <div class="tile"><span class="em">💳</span>결제내역</div>
          </div>
          <div style="font-size:13px;font-weight:800;margin:6px 0 8px">이번달 등록 현황</div>
          <div class="card">
            <div class="grid3" style="text-align:center">
              <div><div style="font-size:20px;font-weight:900;color:#bbb">01</div><div class="xs">승인대기</div></div>
              <div><div style="font-size:20px;font-weight:900;color:#f66">01</div><div class="xs">반려</div></div>
              <div><div style="font-size:20px;font-weight:900;color:var(--dd-green)">05</div><div class="xs">승인완료</div></div>
            </div>
          </div>
          <div style="font-size:13px;font-weight:800;margin:10px 0 8px">비즈링크 카드결제 서비스</div>
          <div class="card">
            <div class="grid2" style="margin-bottom:8px">
              <div style="background:#f3f3f3;border-radius:12px;padding:18px 8px;text-align:center;font-size:13px;font-weight:600">B2B구매대행<br>바로가기</div>
              <div style="background:#f3f3f3;border-radius:12px;padding:18px 8px;text-align:center;font-size:13px;font-weight:600">구매내역</div>
            </div>
            <div class="row" style="padding:10px 0;border-top:1px solid #f3f3f3;font-size:13px">공급자등록 <span>›</span></div>
            <div class="row" style="padding:10px 0;border-top:1px solid #f3f3f3;font-size:13px">공급자 승인내역 <span>›</span></div>
          </div>
        </div>
        ${G.bnav("home")}`;
    }
  },
  {
    id: "contract1", group: "계약결제", name: "03. 계약등록 · Step1", route: "/contract (1/4)",
    desc: {
      purpose: "계약 유형·계약명 선택. 4스텝 시작.",
      layout: ["Header + progress 25%","유형 3×2 그리드","계약명 입력","다음(유형+명 필수)"],
      rules: ["선택 타일: green border + light bg","유형: 월세/경조사비/학원비/운영비/인건비/배달비"]
    },
    html() {
      return `
        ${G.header("신규계약 등록")}
        <div class="progress"><i style="width:25%"></i></div>
        <div class="pad-nb">
          <p style="font-size:15px;font-weight:600;margin-bottom:14px">계약 유형을 선택해주세요.</p>
          <div class="grid3" style="margin-bottom:16px">
            <div class="tile on"><span class="em">🏠</span>월세</div>
            <div class="tile"><span class="em">🎁</span>경조사비</div>
            <div class="tile"><span class="em">📚</span>학원비</div>
            <div class="tile"><span class="em">💼</span>운영비</div>
            <div class="tile"><span class="em">👤</span>인건비</div>
            <div class="tile"><span class="em">🛵</span>배달비</div>
          </div>
          <div class="label">계약명</div>
          <input class="input" value="월세(홍길동월세)" />
          <button class="btn btn-g" style="margin-top:8px">다음</button>
        </div>`;
    }
  },
  {
    id: "contract2", group: "계약결제", name: "04. 계약등록 · Step2", route: "/contract (2/4)",
    desc: {
      purpose: "거래 상대방(개인/사업자) 정보 + 안심 계좌인증.",
      layout: ["개인/사업자 라디오","성명·주민/사업자번호·은행·계좌","안심 계좌인증 CTA","고지 문구"],
      rules: ["은행 미선택 red 보더","인증 후 green 체크","유효성만 검사, 상대 연락 없음"]
    },
    html() {
      return `
        ${G.header("신규계약 등록")}
        <div class="progress"><i style="width:50%"></i></div>
        <div class="pad-nb">
          <p style="font-size:15px;font-weight:600;margin-bottom:12px">거래 상대방의 정보를 입력해주세요.</p>
          <div class="row" style="justify-content:flex-start;gap:18px;margin-bottom:14px;font-size:13px;font-weight:600">
            <span style="color:var(--dd-green)">● 🏠 개인</span>
            <span style="color:#bbb">○ 🏢 사업자</span>
          </div>
          <div class="label">성명</div><input class="input" value="홍길동" />
          <div class="label">주민번호</div><input class="input" value="800505-1******" />
          <div class="label">은행선택</div>
          <select class="input"><option>국민은행</option></select>
          <div class="label">계좌번호</div><input class="input" value="11111111111" />
          <button class="btn btn-od">안심 계좌인증</button>
          <p class="hint">※ 계좌번호의 유효성 검사만 진행되며, 상대방에게 연락이 가지 않습니다.</p>
          <div class="grid2" style="margin-top:16px"><button class="btn btn-ol">이전</button><button class="btn btn-g">다음</button></div>
        </div>`;
    }
  },
  {
    id: "contract3", group: "계약결제", name: "05. 계약등록 · Step3", route: "/contract (3/4)",
    desc: {
      purpose: "송금액 입력, 결제금액(수수료 6.6%) 산출, 수동/자동 선택.",
      layout: ["송금자명칭","송금금액","결제금액 읽기전용","수동/자동 2버튼"],
      rules: ["결제금액 = 송금액 × 1.066","선택 CTA orange border"]
    },

function renderNav() {
  const el = document.getElementById("navList");
  let html = "", last = "";
  screens.forEach(s => {
    if (s.group !== last) { html += `<div class="group">${s.group}</div>`; last = s.group; }
    html += `<button type="button" data-id="${s.id}">${s.name}</button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => show(btn.dataset.id));
  });
}

function show(id) {
  const s = screens.find(x => x.id === id);
  if (!s) return;
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  document.getElementById("stageTitle").textContent = `${s.name}  ·  ${s.route}`;
  document.getElementById("phone").innerHTML = s.html();
  document.getElementById("desc").innerHTML = `
    <span class="tag">${s.group}</span>
    <h2>${s.name}</h2>
    <div class="route">${s.route}</div>
    <h3>목적</h3><p>${s.desc.purpose}</p>
    <h3>레이아웃</h3><ul>${s.desc.layout.map(i=>`<li>${i}</li>`).join("")}</ul>
    <h3>규칙 / 인터랙션</h3><ul>${s.desc.rules.map(i=>`<li>${i}</li>`).join("")}</ul>
  `;
  location.hash = id;
}

renderNav();
show((location.hash || "#login").slice(1) || "login");
